[project]
name = "netexec-mcp"
version = "0.1.0"
description = "MCP server that drives NetExec (nxc) for authorized security testing."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "netexec", "nxc", "pentest", "security", "active-directory", "smb", "ldap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "fastmcp>=2.0",
]

[project.scripts]
netexec-mcp = "netexec_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netexec_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
